name: iOS build

# Triggerable from your phone: the GitHub mobile app (Actions tab → Run workflow)
# or `gh workflow run "iOS build"`.
#
# This default job does an UNSIGNED simulator build — it proves the app compiles
# on a cloud Mac with no Apple account or certificates needed. Producing an
# installable / App Store .ipa requires code signing; see the commented
# "archive-and-export" job below and CAPACITOR.md for the one-time secret setup.
on:
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web payload + sync to iOS
        run: |
          npm run build:web
          npx cap sync ios

      - name: Build (unsigned, simulator) to verify it compiles
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

# ---------------------------------------------------------------------------
# SIGNED App Store build — produces an uploadable .ipa.
#
# This job only runs once ALL of these repo secrets exist
# (Settings → Secrets and variables → Actions):
#
#   BUILD_CERT_P12_BASE64        Apple *Distribution* certificate (.p12), base64
#   P12_PASSWORD                 password you set when exporting the .p12
#   PROVISIONING_PROFILE_BASE64  App Store provisioning profile, base64
#   APPLE_TEAM_ID                your 10-char Apple Team ID (App Store Connect → Membership)
#
# Base64-encode a file with:  base64 -i cert.p12 | pbcopy
# Until the secrets exist the job self-skips, so enabling it now is harmless.
# See CAPACITOR.md for the full walkthrough.
# ---------------------------------------------------------------------------
  archive-and-export:
    runs-on: macos-latest
    # Skip cleanly until the signing secrets have been added.
    if: ${{ vars.IOS_SIGNING_READY == 'true' }}
    env:
      BUNDLE_ID: com.spencersearle.monolito
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web payload + sync to iOS
        run: |
          npm ci
          npm run build:web
          npx cap sync ios

      - name: Install signing certificate & provisioning profile
        env:
          BUILD_CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$BUILD_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Temporary keychain that only lives for this run.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install the profile under its own UUID and expose its Name for signing.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$DECODED"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # Optional: auto-upload straight to TestFlight instead of downloading the
      # .ipa by hand. Needs an App Store Connect API key (3 more secrets) — see
      # CAPACITOR.md. Uncomment when you want it.
      #
      # - name: Upload to TestFlight
      #   env:
      #     ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      #     ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      #     ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      #   run: |
      #     mkdir -p ~/.appstoreconnect/private_keys
      #     echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      #     xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
      #       --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
