name: iOS build

# Triggerable from your phone: the GitHub mobile app (Actions tab → Run workflow)
# or `gh workflow run "iOS build"`.
#
# This default job does an UNSIGNED simulator build — it proves the app compiles
# on a cloud Mac with no Apple account or certificates needed. Producing an
# installable / App Store .ipa requires code signing; see the commented
# "archive-and-export" job below and CAPACITOR.md for the one-time secret setup.
on:
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web payload + sync to iOS
        run: |
          npm run build:web
          npx cap sync ios

      - name: Build (unsigned, simulator) to verify it compiles
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

