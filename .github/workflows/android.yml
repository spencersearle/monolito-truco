name: Android build

# Triggerable from your phone: the GitHub mobile app (Actions tab → Run workflow)
# or `gh workflow run "Android build"`. Also runs automatically on pushes to main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build web payload + sync to Android
        run: |
          npm run build:web
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK (installable) + release AAB (for Play)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
