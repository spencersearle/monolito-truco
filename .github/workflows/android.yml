name: Android build

# Triggerable from your phone: the GitHub mobile app (Actions tab → Run workflow)
# or `gh workflow run "Android build"`. Also runs automatically on pushes to main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build web payload + sync to Android
        run: |
          npm run build:web
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Play rejects unsigned uploads. The keystore lives in a repository secret
      # (base64 of the .jks); this writes it to a scratch file outside the repo
      # and hands gradle its path. Gated on the ANDROID_SIGNING_READY variable so
      # adding the four secrets one at a time never triggers a half-signed run —
      # same pattern as IOS_SIGNING_READY in ios.yml.
      - name: Decode upload keystore
        if: vars.ANDROID_SIGNING_READY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "MONOLITO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build debug APK (installable) + release AAB (for Play)
        working-directory: android
        env:
          MONOLITO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MONOLITO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MONOLITO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease

      # Cheap insurance against uploading an unsigned bundle and getting a
      # confusing Play Console error: fail here instead, where the cause is named.
      - name: Verify the release bundle is signed
        if: vars.ANDROID_SIGNING_READY == 'true'
        run: |
          BUNDLE=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          if unzip -l "$BUNDLE" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "Signed: $BUNDLE"
          else
            echo "::error::$BUNDLE is unsigned — check the ANDROID_* secrets."
            exit 1
          fi

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
